---
# Source: apache-webserver/templates/secret.yaml
apiVersion: v1
data:
  tls.crt: 
  tls.key: 
kind: Secret
metadata:
  name: apache-tls
type: kubernetes.io/tls

---
# Source: apache-webserver/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
    name: apache-ssl-config
data:
    ssl.conf: |
        Listen 443
        LoadModule ssl_module modules/mod_ssl.so
            <VirtualHost *:443>
                ServerName apache.webserver
                DocumentRoot "/usr/local/apache2/htdocs"

                <Directory "/usr/local/apache2/htdocs">
                    Require all granted
                </Directory>
                    SSLEngine on
                    SSLCertificateFile "/usr/local/apache2/conf/tls/tls.crt"
                    SSLCertificateKeyFile "/usr/local/apache2/conf/tls/tls.key"
            </VirtualHost>

---
# Source: apache-webserver/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: apache-apache-webserver
  labels:
    helm.sh/chart: apache-webserver-0.1.0
    app.kubernetes.io/name: apache-webserver
    app.kubernetes.io/instance: apache
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app.kubernetes.io/name: apache-webserver
    app.kubernetes.io/instance: apache

---
# Source: apache-webserver/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-apache-webserver
  labels:
    helm.sh/chart: apache-webserver-0.1.0
    app.kubernetes.io/name: apache-webserver
    app.kubernetes.io/instance: apache
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apache-webserver
      app.kubernetes.io/instance: apache
  template:
    metadata:
      labels:
        helm.sh/chart: apache-webserver-0.1.0
        app.kubernetes.io/name: apache-webserver
        app.kubernetes.io/instance: apache
        app.kubernetes.io/version: "2.4"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: default
      containers:
        - name: apache-webserver
          image: "httpd:2.4"
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/httpd-foreground
          args:
            - "-c"
            - "Include /usr/local/apache2/conf/extra/ssl.conf"
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/local/apache2/conf/tls
              name: tls
              readOnly: true
            - mountPath: /usr/local/apache2/conf/extra/ssl.conf
              name: ssl-config
              readOnly: true
              subPath: ssl.conf
      volumes:
        - name: tls
          secret:
            secretName: apache-tls
        - configMap:
            name: apache-ssl-config
          name: ssl-config

---
# Source: apache-webserver/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apache-apache-webserver
  labels:
    helm.sh/chart: apache-webserver-0.1.0
    app.kubernetes.io/name: apache-webserver
    app.kubernetes.io/instance: apache
    app.kubernetes.io/version: "2.4"
    app.kubernetes.io/managed-by: Helm
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "apache.webserver"
      secretName: apache-tls
  rules:
    - host: "apache.webserver"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apache-apache-webserver
                port:
                  number: 443
